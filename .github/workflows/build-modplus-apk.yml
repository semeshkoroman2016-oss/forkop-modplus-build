name: Build Forkop MOD+ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - cudy-tr3000
          - orangepi-r1-plus-lts

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot file gcc git make patch perl zstd curl util-linux

      - name: Enable unprivileged user namespaces for APK build
        run: |
          set -euxo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r true

      - name: Checkout frozen Forkop MOD 1.0.7 source
        run: |
          set -euxo pipefail
          git clone https://github.com/Gavr1024/forkop-mod.git src
          cd src
          git checkout a2810b4da3e75775ac05778e7e53f57804b3e60c
          test "$(git rev-parse HEAD)" = "a2810b4da3e75775ac05778e7e53f57804b3e60c"

      - name: Apply platform patchset
        run: |
          set -euxo pipefail
          case "${{ matrix.platform }}" in
            cudy-tr3000)
              PATCH_FILE="$GITHUB_WORKSPACE/patches/cudy-tr3000.patch"
              ;;
            orangepi-r1-plus-lts)
              PATCH_FILE="$GITHUB_WORKSPACE/patches/orangepi-r1-plus-lts.patch"
              ;;
            *)
              exit 2
              ;;
          esac
          cd src
          patch -p2 --forward --batch < "$PATCH_FILE"

      - name: Verify expected fixes
        run: |
          set -euxo pipefail
          grep -q 'spider_x' src/forkop/files/usr/lib/singbox/generator.uc
          case "${{ matrix.platform }}" in
            cudy-tr3000)
              grep -q 'mark-pending-reload' src/forkop/files/usr/lib/components/updates.uc
              grep -q 'Cudy FixPack' src/luci-app-forkop/htdocs/luci-static/resources/view/forkop/main.js
              ;;
            orangepi-r1-plus-lts)
              test -f src/forkop/files/usr/lib/forkop/community-cidr-sync.sh
              test -f src/forkop/files/usr/lib/forkop/community-ruleset-enum.uc
              ;;
          esac

      - name: Build Forkop packages
        working-directory: src
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh 1.0.7 dist/modplus-apk

      - name: Generate checksums
        working-directory: src/dist/modplus-apk
        run: |
          set -euxo pipefail
          find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: forkop-modplus-${{ matrix.platform }}-1.0.7-packages
          path: |
            src/dist/modplus-apk/*.apk
            src/dist/modplus-apk/*.ipk
            src/dist/modplus-apk/SHA256SUMS
          if-no-files-found: error
